# 生产部署编排：MySQL + Spring Boot API + Nginx 静态站点/反向代理
# 使用前复制 .env.example 为 .env，填入真实密钥；目录布局见 README.md。
name: zhixing

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-zhixing_training}
      MYSQL_USER: ${MYSQL_USER:-training_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      TZ: ${TZ:-Asia/Shanghai}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
    volumes:
      - ./data/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
    logging: &logging
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    networks: [internal]

  api:
    image: eclipse-temurin:21-jre
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      SERVER_PORT: "8081"
      TRAINING_DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-zhixing_training}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&useSSL=false&allowPublicKeyRetrieval=true
      TRAINING_DB_USER: ${MYSQL_USER:-training_app}
      TRAINING_DB_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      TRAINING_JWT_SECRET: ${TRAINING_JWT_SECRET:?set TRAINING_JWT_SECRET in .env}
      TRAINING_CORS_ORIGINS: ${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN in .env}
      TRAINING_PUBLIC_WEB_URL: ${PUBLIC_ORIGIN}
      TRAINING_STORAGE_ROOT: /app/data/uploads
      TRAINING_CERTIFICATE_TIME_ZONE: ${TRAINING_CERTIFICATE_TIME_ZONE:-Asia/Shanghai}
      ZHIXING_COOKIE_SECURE: ${COOKIE_SECURE:-false}
      JAVA_TOOL_OPTIONS: "-Xms256m -Xmx768m -XX:+UseG1GC"
    command: ["java", "-jar", "/app/app.jar"]
    volumes:
      - ./app/training-api.jar:/app/app.jar:ro
      - ./data/uploads:/app/data/uploads
    logging: *logging
    networks: [internal]

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "${HTTP_PORT:-80}:80"
      # 部分国内主机在未备案时会拦截 80/443，保留一个可直接访问的高位端口
      - "${ALT_HTTP_PORT:-8091}:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    logging: *logging
    networks: [internal]

networks:
  internal:
